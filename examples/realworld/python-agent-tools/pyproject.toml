[build-system]
requires = ["sengoo-python==0.1.0"]
build-backend = "sengoo_python.backend"

[project]
name = "sengoo-agent-tools-example"
version = "0.1.0"
requires-python = ">=3.11"

[tool.sengoo]
manifest = "Sengoo.toml"
module = "sengoo_agent_tools"
exports = ["validation_report", "require_valid_tool", "canonical_arguments", "native_live_strings", "native_live_buffers", "native_live_documents"]
