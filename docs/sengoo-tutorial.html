<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sengoo Tutorial</title>
  <style>
    :root {
      --bg: #eef3f9;
      --panel: #ffffff;
      --line: #d6e0ee;
      --text: #162335;
      --sub: #51627b;
      --brand: #0f4c81;
      --brand-soft: #dce8f5;
      --code-bg: #f4f8ff;
      --code-line: #cedaeb;
      --ok: #0a7d4e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at top left, #f9fcff 0%, var(--bg) 42%, #e7eef8 100%);
      color: var(--text);
      min-height: 100vh;
    }

    .app {
      max-width: 1320px;
      margin: 0 auto;
      padding: 20px;
    }

    .topbar {
      background: linear-gradient(90deg, #0d4a7d 0%, #16629f 100%);
      color: #fff;
      border-radius: 14px;
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 30px rgba(13, 74, 125, 0.20);
    }

    .title-group h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: 0.3px;
    }

    .title-group p {
      margin: 6px 0 0;
      color: #d8e7f7;
      font-size: 15px;
    }

    .lang-switch {
      display: inline-flex;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 10px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.10);
    }

    .lang-switch button {
      border: 0;
      background: transparent;
      color: #fff;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .lang-switch button.active {
      background: #fff;
      color: var(--brand);
    }

    .layout {
      margin-top: 16px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 16px;
      align-items: start;
    }

    .sidebar {
      position: sticky;
      top: 20px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(20, 38, 62, 0.08);
    }

    .sidebar-header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      background: #f7fbff;
    }

    .sidebar-header h2 {
      margin: 0;
      font-size: 17px;
      color: #1f3655;
    }

    .toc {
      list-style: none;
      margin: 0;
      padding: 10px;
      max-height: calc(100vh - 140px);
      overflow: auto;
    }

    .toc .toc-group-title {
      margin: 10px 0 6px;
      padding: 4px 8px;
      font-size: 12px;
      letter-spacing: 0.5px;
      font-weight: 800;
      color: #2f587f;
      text-transform: uppercase;
    }

    .toc button {
      width: 100%;
      text-align: left;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      color: #263950;
      padding: 12px 12px;
      cursor: pointer;
      font-size: 14px;
      line-height: 1.35;
      margin-bottom: 6px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .toc button:hover {
      background: #f3f8ff;
      border-color: #d5e3f5;
    }

    .toc button.active {
      background: var(--brand-soft);
      border-color: #bfd5ee;
      color: #0e3f6e;
      font-weight: 700;
    }

    .content {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(20, 38, 62, 0.08);
      overflow: hidden;
    }

    .chapter-head {
      padding: 22px 24px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #f8fbff 0%, #f1f6fd 100%);
    }

    .chapter-meta {
      margin: 0 0 8px;
      color: #4f6584;
      font-size: 13px;
      letter-spacing: 0.2px;
    }

    .chapter-title {
      margin: 0;
      font-size: 34px;
      line-height: 1.15;
      color: #113e68;
    }

    .chapter-summary {
      margin: 10px 0 0;
      color: #2f445f;
      font-size: 16px;
      line-height: 1.65;
      max-width: 980px;
    }

    .chapter-body {
      padding: 22px 24px 26px;
    }

    .lesson {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      margin-bottom: 14px;
    }

    .lesson h3 {
      margin: 0 0 10px;
      color: #19466f;
      font-size: 22px;
    }

    .lesson p {
      margin: 0 0 10px;
      line-height: 1.72;
      color: #2b3e55;
      font-size: 15px;
    }

    .lesson ul,
    .lesson ol {
      margin: 4px 0 12px 18px;
      padding: 0;
      color: #2b3e55;
      line-height: 1.72;
    }

    .lesson li {
      margin-bottom: 6px;
    }

    .code-card {
      border: 1px solid var(--code-line);
      border-radius: 10px;
      overflow: hidden;
      margin: 12px 0 10px;
      background: #fff;
    }

    .code-card header {
      border-bottom: 1px solid var(--code-line);
      background: #ecf4ff;
      color: #21486f;
      font-size: 13px;
      padding: 7px 10px;
      font-weight: 600;
    }

    pre {
      margin: 0;
      padding: 14px;
      background: var(--code-bg);
      color: #1b3047;
      font-size: 14px;
      line-height: 1.55;
      overflow-x: auto;
    }

    code {
      font-family: "Consolas", "Cascadia Code", "Fira Code", monospace;
    }

    .chapter-takeaway {
      margin-top: 12px;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #cce5da;
      background: #effaf4;
      color: #104f35;
      font-size: 15px;
      line-height: 1.6;
    }

    .chapter-nav {
      border-top: 1px solid var(--line);
      background: #f8fbff;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 24px;
    }

    .chapter-nav button {
      border: 1px solid #b9cee7;
      border-radius: 10px;
      padding: 9px 14px;
      cursor: pointer;
      background: #fff;
      color: #1a4f7d;
      font-size: 14px;
      font-weight: 600;
      min-width: 154px;
      text-align: center;
    }

    .chapter-nav button:hover:not(:disabled) {
      background: #eaf3ff;
    }

    .chapter-nav button:disabled {
      color: #95a6ba;
      border-color: #d8e2ef;
      background: #f3f6fa;
      cursor: not-allowed;
    }

    .empty {
      padding: 20px;
      color: #4a607c;
    }

    @media (max-width: 1040px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
      }

      .toc {
        max-height: 280px;
      }

      .chapter-title {
        font-size: 29px;
      }
    }

    @media (max-width: 720px) {
      .app {
        padding: 12px;
      }

      .topbar {
        padding: 14px;
      }

      .title-group h1 {
        font-size: 24px;
      }

      .chapter-head,
      .chapter-body,
      .chapter-nav {
        padding-left: 14px;
        padding-right: 14px;
      }

      .chapter-nav {
        flex-direction: column;
      }

      .chapter-nav button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="title-group">
        <h1 id="site-title">Sengoo Tutorial</h1>
        <p id="site-subtitle">Learn syntax, workflow, tooling, interop, and reflection step by step.</p>
      </div>
      <div class="lang-switch" role="group" aria-label="Language switch">
        <button id="lang-en" type="button" class="active">English</button>
        <button id="lang-zh" type="button">中文</button>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2 id="toc-title">Chapters</h2>
        </div>
        <ul class="toc" id="toc-list"></ul>
      </aside>

      <section class="content" aria-live="polite">
        <div id="chapter-root"></div>
      </section>
    </main>
  </div>

  <script>
    const UI_TEXT = {
      en: {
        siteTitle: "Sengoo Tutorial",
        siteSubtitle: "Learn syntax, workflow, tooling, interop, and reflection step by step.",
        tocTitle: "Chapters",
        chapterLabel: "Chapter",
        lessonLabel: "Lesson",
        prev: "Previous Chapter",
        next: "Next Chapter",
        first: "You are at the first chapter.",
        last: "You are at the last chapter."
      },
      zh: {
        siteTitle: "Sengoo 入门与实践教程",
        siteSubtitle: "从语法到工程流程，逐章掌握 Sengoo 的开发方式。",
        tocTitle: "章节目录",
        chapterLabel: "第",
        lessonLabel: "小节",
        prev: "上一章",
        next: "下一章",
        first: "当前已经是第一章。",
        last: "当前已经是最后一章。"
      }
    };

    const CORE_CHAPTERS = [
      {
        id: "language-overview",
        title: {
          en: "1. Language Overview",
          zh: "1. 语言定位与目标"
        },
        summary: {
          en: "Sengoo is a compiled language built for practical engineering: native-speed execution, faster edit-build loops, and smooth migration from Python-heavy stacks.",
          zh: "Sengoo 是一门面向工程落地的编译型语言，核心目标是原生性能、快速迭代编译，以及从 Python 体系平滑迁移。"
        },
        sections: [
          {
            heading: { en: "What kind of language is Sengoo?", zh: "Sengoo 属于什么类型语言？" },
            paragraphs: {
              en: [
                "Sengoo uses static compilation (LLVM backend) and expression-oriented syntax. You write source code, compile it, then run native binaries.",
                "The language is designed around day-to-day developer productivity: keep syntax simple, keep diagnostics readable, and reduce wasted rebuild work."
              ],
              zh: [
                "Sengoo 采用静态编译（LLVM 后端）和表达式风格语法。你先写源码，再编译成原生可执行文件运行。",
                "它强调开发效率：语法尽量简单、报错尽量可读、构建链尽量减少无效重编译。"
              ]
            },
            bullets: {
              en: [
                "Compiled language with native executable output.",
                "Incremental-oriented pipeline for faster local iteration.",
                "Supports Python interop and optional reflection metadata."
              ],
              zh: [
                "编译型语言，可输出原生可执行程序。",
                "编译链强调增量能力，优化本地开发迭代速度。",
                "支持 Python 互操作和可选反射元数据。"
              ]
            }
          },
          {
            heading: { en: "What problems does it try to solve?", zh: "它主要解决什么问题？" },
            paragraphs: {
              en: [
                "Many teams need better runtime performance but cannot rewrite entire Python systems at once. Sengoo is positioned as a practical middle path.",
                "You can move hot paths and compute-heavy logic into Sengoo, while keeping existing Python orchestration where needed."
              ],
              zh: [
                "很多团队希望提升运行性能，但又无法一次性重写整个 Python 系统。Sengoo 的定位就是这条现实中间路线。",
                "你可以优先把热点或计算密集逻辑迁到 Sengoo，同时保留已有 Python 编排部分。"
              ]
            }
          },
          {
            heading: { en: "First mental model", zh: "先建立一个心智模型" },
            paragraphs: {
              en: [
                "Treat Sengoo as: concise syntax + native execution + tooling for fast feedback. Learn the core syntax first, then CLI workflow, then interop/reflection.",
                "This tutorial is chapter-based. Click a chapter on the left; the right panel shows one complete chapter page."
              ],
              zh: [
                "可以把 Sengoo 理解为：简洁语法 + 原生性能 + 快速反馈工具链。建议先掌握核心语法，再掌握 CLI 流程，最后学习互操作和反射。",
                "本教程采用单章单页模式。点击左侧目录，右侧只展示当前章节完整内容。"
              ]
            }
          }
        ],
        takeaway: {
          en: "Takeaway: Sengoo is not trying to replace everything at once. It is built for performance-sensitive paths with practical migration and fast development loops.",
          zh: "本章结论：Sengoo 不是一刀切替换，而是面向性能关键路径与工程迁移现实的语言。"
        }
      },
      {
        id: "environment-and-installation",
        title: {
          en: "2. Environment and Installation",
          zh: "2. 环境准备与安装"
        },
        summary: {
          en: "Set up toolchain once, then keep a predictable local workflow. This chapter covers required dependencies and the standard build flow.",
          zh: "先把开发环境搭起来，再形成稳定可复现的本地流程。本章介绍依赖、构建和快速验证。"
        },
        sections: [
          {
            heading: { en: "Required components", zh: "基础依赖" },
            bullets: {
              en: [
                "Rust toolchain (for building compiler/runtime/tools).",
                "LLVM toolchain (for backend code generation and linking).",
                "Optional: Python (for interop tests and benchmark scripts)."
              ],
              zh: [
                "Rust 工具链（用于构建编译器、运行时和工具）。",
                "LLVM 工具链（用于后端生成和链接）。",
                "可选：Python（用于互操作测试和部分基准脚本）。"
              ]
            },
            paragraphs: {
              en: [
                "If your project contains an installer script, run it first to auto-detect and install missing dependencies."
              ],
              zh: [
                "如果仓库里已经有自动安装脚本，建议先运行它，自动检测并补齐缺失依赖。"
              ]
            }
          },
          {
            heading: { en: "Build Sengoo compiler", zh: "构建 Sengoo 编译器" },
            code: {
              title: {
                en: "Build release binaries",
                zh: "构建发布版本二进制"
              },
              lang: "bash",
              snippet: "cargo build --release"
            },
            paragraphs: {
              en: [
                "After successful build, CLI executable is usually at `target/release/sgc.exe` on Windows."
              ],
              zh: [
                "构建完成后，Windows 下一般可以在 `target/release/sgc.exe` 找到命令行程序。"
              ]
            }
          },
          {
            heading: { en: "Quick sanity check", zh: "快速健康检查" },
            code: {
              title: {
                en: "Run a known example",
                zh: "运行一个已知示例"
              },
              lang: "bash",
              snippet: "target/release/sgc run examples/01_hello.sg"
            },
            paragraphs: {
              en: [
                "If this works, your compile + run chain is available. Then continue to syntax chapters."
              ],
              zh: [
                "这一步通过，说明本机编译和运行链路可用，可以继续后面的语法章节。"
              ]
            }
          }
        ],
        takeaway: {
          en: "Takeaway: build once, verify with a tiny example, then keep using the same CLI entry points.",
          zh: "本章结论：先构建一次并用小例子验通，再围绕固定 CLI 命令进行日常开发。"
        }
      },
      {
        id: "program-structure",
        title: {
          en: "3. Program Structure and Syntax Basics",
          zh: "3. 程序结构与语法基础"
        },
        summary: {
          en: "Understand the minimal structure of a Sengoo source file: function entry point, block syntax, and expression-style return values.",
          zh: "掌握 Sengoo 源文件最小结构：入口函数、代码块、表达式返回。"
        },
        sections: [
          {
            heading: { en: "Minimal executable program", zh: "最小可执行程序" },
            code: {
              title: {
                en: "Minimal main function",
                zh: "最小 main 函数"
              },
              lang: "sg",
              snippet: "def main() -> i64 {\n    42\n}"
            },
            paragraphs: {
              en: [
                "`def` declares a function. `main` is entry point. `-> i64` declares return type.",
                "The last expression in a block is returned implicitly, so you do not need `return` in simple cases."
              ],
              zh: [
                "`def` 用于定义函数，`main` 是入口，`-> i64` 表示返回类型。",
                "代码块最后一个表达式会隐式作为返回值，简单场景通常不需要写 `return`。"
              ]
            }
          },
          {
            heading: { en: "Semicolon usage", zh: "分号使用规则" },
            paragraphs: {
              en: [
                "Use semicolons for intermediate statements. Keep the final value expression without semicolon when it is the return value.",
                "This style keeps data flow explicit and reduces accidental empty returns."
              ],
              zh: [
                "中间语句通常使用分号；最后作为返回值的表达式一般不写分号。",
                "这种写法能让数据流更清晰，避免意外返回空值。"
              ]
            },
            code: {
              title: {
                en: "Statement vs final expression",
                zh: "中间语句与尾表达式"
              },
              lang: "sg",
              snippet: "def add_one(x: i64) -> i64 {\n    let y = x + 1;\n    y\n}"
            }
          },
          {
            heading: { en: "Comments and readability", zh: "注释与可读性" },
            bullets: {
              en: [
                "Use `//` for line comments.",
                "Prefer one responsibility per function.",
                "Name values by meaning (e.g., `total`, `risk_score`)."
              ],
              zh: [
                "使用 `//` 写单行注释。",
                "每个函数尽量只做一件事。",
                "变量名体现业务含义，例如 `total`、`risk_score`。"
              ]
            },
            code: {
              title: {
                en: "Comment style",
                zh: "注释示例"
              },
              lang: "sg",
              snippet: "// compute final score from base and bonus\ndef score(base: i64, bonus: i64) -> i64 {\n    base + bonus\n}"
            }
          }
        ],
        takeaway: {
          en: "Takeaway: read Sengoo blocks as expression pipelines. Intermediate statements first, final expression last.",
          zh: "本章结论：把 Sengoo 代码块理解成“表达式流水线”：先中间步骤，最后给出尾表达式。"
        }
      },
      {
        id: "variables-and-types",
        title: {
          en: "4. Variables and Core Types",
          zh: "4. 变量与核心类型"
        },
        summary: {
          en: "This chapter covers practical value binding and common core types used in existing Sengoo examples.",
          zh: "本章聚焦日常最常用的值绑定与基础类型，用当前示例语法讲清楚。"
        },
        sections: [
          {
            heading: { en: "Value binding with `let`", zh: "使用 `let` 绑定值" },
            code: {
              title: {
                en: "Simple binding and arithmetic",
                zh: "基本变量绑定与运算"
              },
              lang: "sg",
              snippet: "def main() -> i64 {\n    let a = 10;\n    let b = 20;\n    let c = a + b;\n    c\n}"
            },
            paragraphs: {
              en: [
                "Use `let` to bind values. Build larger computations from small named steps.",
                "Short, meaningful variable names make debugging faster."
              ],
              zh: [
                "用 `let` 绑定值，建议把复杂逻辑拆成多个小步骤。",
                "短而有语义的变量名能明显提高排错效率。"
              ]
            }
          },
          {
            heading: { en: "Core scalar types", zh: "常见标量类型" },
            bullets: {
              en: [
                "`i64`: common integer type in examples and benchmarks.",
                "`bool`: logical values (`true`/`false`).",
                "Type annotations are explicit in function signatures."
              ],
              zh: [
                "`i64`：示例和基准中最常用的整数类型。",
                "`bool`：布尔值（`true`/`false`）。",
                "函数签名中建议显式标注类型。"
              ]
            },
            code: {
              title: {
                en: "Boolean example",
                zh: "布尔示例"
              },
              lang: "sg",
              snippet: "def is_positive(x: i64) -> bool {\n    x > 0\n}"
            }
          },
          {
            heading: { en: "Reassignment pattern", zh: "变量重赋值模式" },
            code: {
              title: {
                en: "Accumulator style",
                zh: "累加器写法"
              },
              lang: "sg",
              snippet: "def main() -> i64 {\n    let total = 0;\n    total = total + 7;\n    total\n}"
            },
            paragraphs: {
              en: [
                "This style is common in loops and state transitions.",
                "When a value changes over time, keep its update location centralized."
              ],
              zh: [
                "这种写法常用于循环或状态推进。",
                "当变量会变化时，尽量把更新逻辑集中在少数位置。"
              ]
            }
          }
        ],
        takeaway: {
          en: "Takeaway: most beginner programs only need `let`, `i64`, and `bool` to express meaningful logic.",
          zh: "本章结论：只用 `let` + `i64` + `bool`，已经能写出不少有用逻辑。"
        }
      },
      {
        id: "functions",
        title: {
          en: "5. Functions and Reusable Logic",
          zh: "5. 函数与可复用逻辑"
        },
        summary: {
          en: "Functions are the core unit of reuse in Sengoo. Keep them small, typed, and easy to compose.",
          zh: "函数是 Sengoo 最核心的复用单元。建议小函数、强类型、易组合。"
        },
        sections: [
          {
            heading: { en: "Define and call functions", zh: "函数定义与调用" },
            code: {
              title: {
                en: "Function with typed parameters",
                zh: "带类型参数的函数"
              },
              lang: "sg",
              snippet: "def add(a: i64, b: i64) -> i64 {\n    a + b\n}\n\ndef main() -> i64 {\n    add(12, 30)\n}"
            },
            paragraphs: {
              en: [
                "Function signatures make input/output contracts explicit.",
                "When behavior changes, update signatures early so compiler errors guide the refactor."

    function makeTopicChapter(spec, chapterNumber) {
      return {
        id: spec.id,
        group: spec.group,
        title: {
          en: `${chapterNumber}. ${spec.title.en}`,
          zh: `${chapterNumber}. ${spec.title.zh}`
        },
        summary: spec.summary,
        sections: [
          {
            heading: { en: "Core Idea", zh: "核心要点" },
            paragraphs: spec.core
          },
          {
            heading: { en: "Checklist", zh: "检查清单" },
            bullets: spec.checklist
          },
          {
            heading: { en: "Example and Practice", zh: "示例与实践" },
            paragraphs: spec.practice,
            code: {
              title: spec.exampleTitle,
              lang: spec.exampleLang,
              snippet: spec.example
            }
          }
        ],
        takeaway: spec.takeaway
      };
    }

    const EXTRA_TOPIC_CHAPTERS = EXTRA_TOPIC_SPECS.map((spec, idx) =>
      makeTopicChapter(spec, CORE_CHAPTERS.length + idx + 1)
    );

    function hasNumberPrefix(textValue) {
      return /^\d+\.\s/.test(textValue || "");
    }

    function normalizeI18nList(list) {
      if (!list) {
        return { en: [], zh: [] };
      }
      if (Array.isArray(list)) {
        return { en: list, zh: list };
      }
      return {
        en: Array.isArray(list.en) ? list.en : [],
        zh: Array.isArray(list.zh) ? list.zh : []
      };
    }

    function normalizeChapter(chapter, index) {
      const next = { ...chapter };
      if (next.title && !hasNumberPrefix(next.title.en) && !hasNumberPrefix(next.title.zh)) {
        next.title = {
          en: `${index + 1}. ${next.title.en}`,
          zh: `${index + 1}. ${next.title.zh}`
        };
      }

      if (!Array.isArray(next.sections) || next.sections.length === 0) {
        const hasDraftBlocks = next.core || next.checklist || next.practice || next.example;
        if (hasDraftBlocks) {
          const sections = [];
          const core = normalizeI18nList(next.core);
          const checklist = normalizeI18nList(next.checklist);
          const practice = normalizeI18nList(next.practice);

          if (core.en.length || core.zh.length) {
            sections.push({
              heading: { en: "Core Idea", zh: "核心要点" },
              paragraphs: core
            });
          }

          if (checklist.en.length || checklist.zh.length) {
            sections.push({
              heading: { en: "Checklist", zh: "检查清单" },
              bullets: checklist
            });
          }

          const practiceSection = {
            heading: { en: "Example and Practice", zh: "示例与实践" },
            paragraphs: practice
          };
          if (next.example) {
            practiceSection.code = {
              title: next.exampleTitle || { en: "Example", zh: "示例" },
              lang: next.exampleLang || "sg",
              snippet: next.example
            };
          }
          if (
            (practiceSection.paragraphs.en && practiceSection.paragraphs.en.length) ||
            (practiceSection.paragraphs.zh && practiceSection.paragraphs.zh.length) ||
            practiceSection.code
          ) {
            sections.push(practiceSection);
          }

          next.sections = sections;
        }
      }

      return next;
    }

    const CHAPTERS = [...CORE_CHAPTERS, ...EXTRA_TOPIC_CHAPTERS].map((chapter, index) =>
      normalizeChapter(chapter, index)
    );

    function groupForChapter(chapter, idx) {
      if (chapter.group && TOPIC_GROUPS[chapter.group]) {
        return TOPIC_GROUPS[chapter.group];
      }
      if (idx < 5) {
        return { en: "Start Here", zh: "快速开始" };
      }
      if (idx < 13) {
        return { en: "Core Language", zh: "核心语言" };
      }
      return { en: "Core Advanced", zh: "核心进阶" };
    }

    const state = {
      lang: "en",
      chapterIndex: 0
    };

    function text(node) {
      return node ? node[state.lang] : "";
    }

    function parseHash() {
      const raw = window.location.hash.replace(/^#/, "").trim();
      if (!raw) return;
      const parts = raw.split(":");
      if (parts.length !== 2) return;
      const [lang, chapterId] = parts;
      if (lang === "en" || lang === "zh") {
        state.lang = lang;
      }
      const idx = CHAPTERS.findIndex((c) => c.id === chapterId);
      if (idx >= 0) {
        state.chapterIndex = idx;
      }
    }

    function updateHash() {
      const chapter = CHAPTERS[state.chapterIndex];
      if (!chapter) {
        return;
      }
      window.location.hash = `${state.lang}:${chapter.id}`;
    }

    function buildCodeCard(codeInfo) {
      const wrapper = document.createElement("div");
      wrapper.className = "code-card";
      const head = document.createElement("header");
      head.textContent = text(codeInfo.title);
      wrapper.appendChild(head);
      const pre = document.createElement("pre");
      const code = document.createElement("code");
      code.className = codeInfo.lang ? `language-${codeInfo.lang}` : "";
      code.textContent = codeInfo.snippet;
      pre.appendChild(code);
      wrapper.appendChild(pre);
      return wrapper;
    }

    function buildLesson(lesson, index) {
      const lessonEl = document.createElement("article");
      lessonEl.className = "lesson";

      const h3 = document.createElement("h3");
      const ui = UI_TEXT[state.lang];
      h3.textContent = `${ui.lessonLabel} ${index + 1}: ${text(lesson.heading)}`;
      lessonEl.appendChild(h3);

      if (lesson.paragraphs) {
        text(lesson.paragraphs).forEach((p) => {
          const pe = document.createElement("p");
          pe.textContent = p;
          lessonEl.appendChild(pe);
        });
      }

      if (lesson.bullets && text(lesson.bullets).length > 0) {
        const ul = document.createElement("ul");
        text(lesson.bullets).forEach((item) => {
          const li = document.createElement("li");
          li.textContent = item;
          ul.appendChild(li);
        });
        lessonEl.appendChild(ul);
      }

      if (lesson.steps && text(lesson.steps).length > 0) {
        const ol = document.createElement("ol");
        text(lesson.steps).forEach((item) => {
          const li = document.createElement("li");
          li.textContent = item;
          ol.appendChild(li);
        });
        lessonEl.appendChild(ol);
      }

      if (lesson.code) {
        lessonEl.appendChild(buildCodeCard(lesson.code));
      }

      return lessonEl;
    }

    function renderTOC() {
      const toc = document.getElementById("toc-list");
      toc.innerHTML = "";
      let currentGroupLabel = "";
      CHAPTERS.forEach((chapter, idx) => {
        const group = groupForChapter(chapter, idx);
        const groupLabel = state.lang === "zh" ? group.zh : group.en;
        if (groupLabel !== currentGroupLabel) {
          const groupLi = document.createElement("li");
          groupLi.className = "toc-group-title";
          groupLi.textContent = groupLabel;
          toc.appendChild(groupLi);
          currentGroupLabel = groupLabel;
        }

        const li = document.createElement("li");
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = text(chapter.title);
        if (idx === state.chapterIndex) btn.classList.add("active");
        btn.addEventListener("click", () => {
          state.chapterIndex = idx;
          render();
        });
        li.appendChild(btn);
        toc.appendChild(li);
      });
    }

    function renderChapter() {
      const root = document.getElementById("chapter-root");
      root.innerHTML = "";
      const chapter = CHAPTERS[state.chapterIndex];
      if (!chapter) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No chapter found.";
        root.appendChild(empty);
        return;
      }

      const ui = UI_TEXT[state.lang];
      const head = document.createElement("header");
      head.className = "chapter-head";

      const meta = document.createElement("p");
      meta.className = "chapter-meta";
      meta.textContent = `${ui.chapterLabel} ${state.chapterIndex + 1} / ${CHAPTERS.length}`;
      head.appendChild(meta);

      const title = document.createElement("h2");
      title.className = "chapter-title";
      title.textContent = text(chapter.title);
      head.appendChild(title);

      const summary = document.createElement("p");
      summary.className = "chapter-summary";
      summary.textContent = text(chapter.summary);
      head.appendChild(summary);

      root.appendChild(head);

      const body = document.createElement("section");
      body.className = "chapter-body";
      chapter.sections.forEach((lesson, idx) => {
        body.appendChild(buildLesson(lesson, idx));
      });

      const takeaway = document.createElement("div");
      takeaway.className = "chapter-takeaway";
      takeaway.textContent = text(chapter.takeaway);
      body.appendChild(takeaway);
      root.appendChild(body);

      const nav = document.createElement("footer");
      nav.className = "chapter-nav";

      const prev = document.createElement("button");
      prev.type = "button";
      prev.textContent = ui.prev;
      prev.disabled = state.chapterIndex === 0;
      prev.title = prev.disabled ? ui.first : "";
      prev.addEventListener("click", () => {
        if (state.chapterIndex > 0) {
          state.chapterIndex -= 1;
          render();
        }
      });

      const next = document.createElement("button");
      next.type = "button";
      next.textContent = ui.next;
      next.disabled = state.chapterIndex >= CHAPTERS.length - 1;
      next.title = next.disabled ? ui.last : "";
      next.addEventListener("click", () => {
        if (state.chapterIndex < CHAPTERS.length - 1) {
          state.chapterIndex += 1;
          render();
        }
      });

      nav.appendChild(prev);
      nav.appendChild(next);
      root.appendChild(nav);
    }

    function renderTopbar() {
      const ui = UI_TEXT[state.lang];
      document.getElementById("site-title").textContent = ui.siteTitle;
      document.getElementById("site-subtitle").textContent = ui.siteSubtitle;
      document.getElementById("toc-title").textContent = ui.tocTitle;
      document.getElementById("lang-en").classList.toggle("active", state.lang === "en");
      document.getElementById("lang-zh").classList.toggle("active", state.lang === "zh");
      document.documentElement.lang = state.lang === "zh" ? "zh-CN" : "en";
    }

    function render() {
      renderTopbar();
      renderTOC();
      renderChapter();
      updateHash();
    }

    function initEvents() {
      document.getElementById("lang-en").addEventListener("click", () => {
        state.lang = "en";
        render();
      });
      document.getElementById("lang-zh").addEventListener("click", () => {
        state.lang = "zh";
        render();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "ArrowLeft" && state.chapterIndex > 0) {
          state.chapterIndex -= 1;
          render();
        }
        if (event.key === "ArrowRight" && state.chapterIndex < CHAPTERS.length - 1) {
          state.chapterIndex += 1;
          render();
        }
      });

      window.addEventListener("hashchange", () => {
        const prevLang = state.lang;
        const prevIndex = state.chapterIndex;
        parseHash();
        if (prevLang !== state.lang || prevIndex !== state.chapterIndex) {
          render();
        }
      });
    }

    parseHash();
    initEvents();
    render();
  </script>
