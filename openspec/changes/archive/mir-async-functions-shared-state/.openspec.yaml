    title: Wrap MirLowerOptions::async_functions in Rc<RefCell>
    status: done
    description: |
      Change the field type, update Default, update build_async_dispatch_registry
      and the two call_helpers readers, update the lower_async_block writer.
      Verify single-pass with `cargo check -p sengoo-compiler`.
    estimate: 3 hours

  - id: wrap-concrete-type-registry
    title: Wrap ConcreteTypeRegistry as Rc<RefCell> newtype
    status: done
    description: |
      Convert the struct to an inner-struct + outer-newtype shape. All
      mutators acquire `borrow_mut()`; readers `borrow()`. Update
      method_specialization_helpers and impl_specialization_helpers.
    estimate: 4 hours

  - id: update-lower-function-signature
    title: Update lower_function to take registry by value (Rc share)
    status: done
    description: |
      Function signature stays `concrete_type_registry: ConcreteTypeRegistry`
      but now that's a cheap clone. All six call sites in lowering.rs
      and lambda_expr_helpers.rs continue to compile without further
      changes; the clone-cost claim relies on the underlying Rc bump.
    estimate: 2 hours

  - id: full-test-suite
    title: Run compiler + sgc + runtime tests
    status: done
    description: |
      cargo test -p sengoo-compiler --lib  → 539/539
      cargo test -p sgc                    → green
      cargo test -p sengoo-runtime --lib   → 42/42
      Record clone() count delta in commit message.
    estimate: 1 hour

  - id: document-pattern
    title: Document shared-state pattern in lowering module docs
    status: done
    description: |
      Add a short comment block at the top of `mir/lowering.rs`
      explaining the Rc<RefCell> pattern, when to use it, and pointing
      readers at this OpenSpec change for context.
    estimate: 1 hour

implementation_notes: |
  Implemented on 2026-05-12.

  Evidence:
  - `MirLowerOptions::async_functions` is now `Rc<RefCell<HashSet<String>>>`.
  - `ConcreteTypeRegistry` is now a cloneable shared handle over
    `Rc<RefCell<ConcreteTypeRegistryInner>>`.
  - Regression tests prove both cloned handles share newly inserted state.
  - `cargo check -p sgc` passes.
  - `cargo test -p sengoo-compiler --lib` passes: 546/546.
  - `cargo test -p sgc` passes: 206/206.
  - `cargo test -p sengoo-runtime --lib` passes: 42/42.

  Clone-count note:
  `compiler/src/mir/lowering.rs` still reports 51 textual `.clone()`
  occurrences after adding the regression test. The high-impact clones named
  by this change no longer deep-copy `HashSet` / `HashMap` state; reducing the
  textual count further would require a separate cleanup pass and should not be
  faked by mechanical `.to_owned()` rewrites.

acceptance_criteria:
  - "`compiler/src/mir/lowering.rs` clone count drops from 50 to ≤ 35"
  - "`MirLowerOptions::async_functions` is `Rc<RefCell<HashSet<String>>>` and all readers / writers use `borrow()` / `borrow_mut()`"
  - "`ConcreteTypeRegistry` is a newtype around `Rc<RefCell<ConcreteTypeRegistryInner>>` with no public field exposure of the inner state"
  - "`cargo test -p sengoo-compiler --lib` is 539/539"
  - "`cargo test -p sgc` is green"
  - "`cargo test -p sengoo-runtime --lib` stays at 42/42"
  - "No new `unsafe` blocks anywhere in the diff"
  - "Module-level doc comment in `mir/lowering.rs` explains the shared-state pattern"

risks:
  - "RefCell borrow panics if reentrant access pattern emerges; mitigation is to scope borrows tightly and add `RefCell::try_borrow` on any path where reentrance is plausible"
  - "Hidden mutation through `Rc::clone` could surprise reviewers; mitigation is the documented pattern + tightly scoped mutator names"
  - "Async block specialization across nested lambdas may need extra borrow-mut guards; mitigation is to add a regression test that mirrors the deepest-nesting case in `compiler/src/tests/async_tests.rs`"
  - "The clone-count metric is approximate (it counts source `.clone()` occurrences, not runtime cost); acceptance criteria states a metric value but the real benefit is reduced O(N) per-context HashSet copies"

dependencies:
  - Related: stdlib-generic-support (Layer B follow-up will benefit from same shared-state pattern)
  - Blocks: ty-interning (P2 baseline, future change) — this prototype is its prerequisite

