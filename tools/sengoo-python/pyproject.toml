[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sengoo-python"
version = "0.1.0"
description = "Typed Sengoo native libraries and platform wheels via PEP 517"
requires-python = ">=3.11,<3.15"
license = {text = "MIT"}

[project.scripts]
sengoo-python = "sengoo_python.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
