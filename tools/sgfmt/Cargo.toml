[package]
name = "sgfmt"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sgfmt"
path = "src/main.rs"

[dependencies]
sengoo-compiler = { path = "../../compiler" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
thiserror = { workspace = true }
miette = { workspace = true }
similar = "2.6"
