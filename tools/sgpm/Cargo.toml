[package]
name = "sgpm"
version.workspace = true
edition = "2021"

[[bin]]
name = "sgpm"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
semver = "1.0"
thiserror = { workspace = true }
miette = { workspace = true }
walkdir = "2.5"
which = "7.0"

# Used by local package artifacts and registry publish uploads.
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.40", features = ["full"] }
flate2 = "1.0"
tar = "0.4"
sha2 = "0.10"
