name: toolchain-distribution

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/toolchain-distribution.yml"
      - "scripts/package-toolchain.ps1"
      - "scripts/install.ps1"
      - "scripts/install.sh"
      - "tools/sgc/**"
      - "tools/sgpm/**"
      - "tools/sgfmt/**"
      - "tools/sglsp/**"
      - "tools/stdlib/**"
      - "compiler/**"
      - "runtime/**"
      - "Cargo.toml"
      - "Cargo.lock"

jobs:
  package-smoke:
    name: package smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: macos-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".Substring(1)
          $line = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          $workspaceVersion = $line.Matches[0].Groups[1].Value
          if ($tagVersion -ne $workspaceVersion) {
            throw "tag version $tagVersion does not match workspace version $workspaceVersion"
          }

      - name: Build release tools
        shell: pwsh
        run: cargo build -p sgc -p sgpm -p sgfmt -p sglsp --release

      - name: Run release smoke matrix
        shell: pwsh
        run: |
          $releaseBin = Resolve-Path target/release
          $suffix = ""
          if ($IsWindows -or $PSVersionTable.PSEdition -eq "Desktop") {
            $suffix = ".exe"
          }
          $env:CARGO_BIN_EXE_sgc = Join-Path $releaseBin "sgc$suffix"
          $env:CARGO_BIN_EXE_sgfmt = Join-Path $releaseBin "sgfmt$suffix"
          & $env:CARGO_BIN_EXE_sgc run examples/01_hello.sg --force-rebuild
          $helloExit = $LASTEXITCODE
          if ($helloExit -ne 42) {
            throw "sgc hello smoke expected exit 42 on ${{ matrix.os }}, got $helloExit"
          }
          cargo test -p sgpm realworld -- --nocapture
          if ($LASTEXITCODE -ne 0) {
            throw "sgpm realworld smoke failed on ${{ matrix.os }}"
          }
          cargo test -p sglsp realworld -- --nocapture
          if ($LASTEXITCODE -ne 0) {
            throw "sglsp realworld smoke failed on ${{ matrix.os }}"
          }
          npx --yes @fission-ai/openspec validate toolchain-distribution --strict
          if ($LASTEXITCODE -ne 0) {
            throw "toolchain-distribution OpenSpec smoke failed on ${{ matrix.os }}"
          }
          npx --yes @fission-ai/openspec validate --all --strict
          if ($LASTEXITCODE -ne 0) {
            throw "OpenSpec all smoke failed on ${{ matrix.os }}"
          }

      - name: Verify installer target detection
        shell: pwsh
        run: |
          if ($IsWindows -or $PSVersionTable.PSEdition -eq "Desktop") {
            $actual = (./scripts/install.ps1 -PrintTarget).Trim()
          } else {
            $actual = (sh scripts/install.sh --print-target).Trim()
          }
          if ($actual -ne "${{ matrix.target }}") {
            throw "installer target mismatch: expected ${{ matrix.target }}, got $actual"
          }

      - name: Package toolchain
        shell: pwsh
        env:
          SENGOO_BUILD_HASH: ${{ github.sha }}
          SENGOO_DIST_TARGET: ${{ matrix.target }}
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".Substring(1)
          } else {
            $version = "0.1.0-ci"
          }
          ./scripts/package-toolchain.ps1 -Version $version -NoBuild -SmokeEvidence "toolchain-distribution workflow package-smoke ${{ matrix.os }} ${{ github.sha }}"

      - name: Prepare local release feed
        shell: pwsh
        env:
          SENGOO_BUILD_HASH: ${{ github.sha }}
          SENGOO_DIST_TARGET: ${{ matrix.target }}
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $baseVersion = "${{ github.ref_name }}".Substring(1)
          } else {
            $baseVersion = "0.1.0-ci"
          }
          $parsedBaseVersion = [System.Management.Automation.SemanticVersion]$baseVersion
          $upgradePatch = $parsedBaseVersion.Patch + 1
          $upgradeVersion = "$($parsedBaseVersion.Major).$($parsedBaseVersion.Minor).$upgradePatch-upgrade-smoke"

          $releaseFeedRoot = Join-Path $env:RUNNER_TEMP "sengoo-local-release-feed-${{ matrix.artifact }}"
          Remove-Item -LiteralPath $releaseFeedRoot -Recurse -Force -ErrorAction SilentlyContinue
          $downloadRoot = Join-Path $releaseFeedRoot "releases/download"
          New-Item -ItemType Directory -Force -Path $downloadRoot | Out-Null

          $primaryArchive = (Get-Content target/dist/latest-archive.txt).Trim()
          $primaryReleaseDir = Join-Path $downloadRoot "v$baseVersion"
          New-Item -ItemType Directory -Force -Path $primaryReleaseDir | Out-Null
          Copy-Item -LiteralPath $primaryArchive -Destination (Join-Path $primaryReleaseDir (Split-Path -Leaf $primaryArchive))
          Copy-Item -LiteralPath "$primaryArchive.sha256" -Destination (Join-Path $primaryReleaseDir (Split-Path -Leaf "$primaryArchive.sha256"))

          $upgradeOutputDir = "target/dist-upgrade-${{ matrix.artifact }}"
          Remove-Item -LiteralPath $upgradeOutputDir -Recurse -Force -ErrorAction SilentlyContinue
          ./scripts/package-toolchain.ps1 -Version $upgradeVersion -OutputDir $upgradeOutputDir -NoBuild -SmokeEvidence "toolchain-distribution workflow upgrade smoke ${{ matrix.os }} ${{ github.sha }}"
          $upgradeArchive = (Get-Content (Join-Path $upgradeOutputDir "latest-archive.txt")).Trim()
          $upgradeReleaseDir = Join-Path $downloadRoot "v$upgradeVersion"
          New-Item -ItemType Directory -Force -Path $upgradeReleaseDir | Out-Null
          Copy-Item -LiteralPath $upgradeArchive -Destination (Join-Path $upgradeReleaseDir (Split-Path -Leaf $upgradeArchive))
          Copy-Item -LiteralPath "$upgradeArchive.sha256" -Destination (Join-Path $upgradeReleaseDir (Split-Path -Leaf "$upgradeArchive.sha256"))

          "SENGOO_LOCAL_RELEASE_FEED=$downloadRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SENGOO_PRIMARY_UPGRADE_VERSION=$baseVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SENGOO_SECONDARY_UPGRADE_VERSION=$upgradeVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install package (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive=$(cat target/dist/latest-archive.txt)
          sh scripts/install.sh "$archive" target/install-smoke

      - name: Install package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Get-Content target/dist/latest-archive.txt
          ./scripts/install.ps1 -Archive $archive -InstallDir target/install-smoke

      - name: Installed stdlib smoke
        shell: pwsh
        run: |
          $bin = Join-Path (Resolve-Path target/install-smoke) "bin"
          $manifest = Get-Content -LiteralPath (Join-Path (Resolve-Path target/install-smoke) "manifest.json") -Raw | ConvertFrom-Json
          $suffix = ""
          if ($IsWindows -or $PSVersionTable.PSEdition -eq "Desktop") {
            $suffix = ".exe"
          }
          $line = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          $workspaceVersion = $line.Matches[0].Groups[1].Value
          $versionSignatures = @{}
          foreach ($tool in @("sgc", "sgpm", "sgfmt", "sglsp")) {
            $exe = Join-Path $bin "$tool$suffix"
            $version = & $exe --version
            Write-Host "$tool version: $version"
            $expectedPattern = "^$tool $([regex]::Escape($workspaceVersion)) \((?<hash>[0-9a-fA-F]{7,40})\)$"
            if ($version -notmatch $expectedPattern) {
              throw "unexpected $tool version output: $version"
            }
            $manifestVersion = $manifest.tool_versions.PSObject.Properties[$tool].Value
            if ($version -ne $manifestVersion) {
              throw "$tool payload does not match manifest: expected $manifestVersion, got $version"
            }
            $versionSignatures[$tool] = "$workspaceVersion|$($Matches.hash)"
          }
          $uniqueSignatures = @($versionSignatures.Values | Sort-Object -Unique)
          if ($uniqueSignatures.Count -ne 1) {
            throw "tool version/hash mismatch: $($versionSignatures | ConvertTo-Json -Compress)"
          }
          $sgc = Join-Path $bin "sgc$suffix"
          & $sgc --version
          & $sgc run examples/01_hello.sg --force-rebuild
          $helloExit = $LASTEXITCODE
          if ($helloExit -ne 42) {
            throw "installed sgc hello smoke expected exit 42, got $helloExit"
          }
          $workRoot = Join-Path ([System.IO.Path]::GetTempPath()) "sengoo-install-smoke-work"
          if ($env:RUNNER_TEMP) {
            $workRoot = Join-Path $env:RUNNER_TEMP "sengoo-install-smoke-work"
          }
          Remove-Item -LiteralPath $workRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $workRoot | Out-Null
          Remove-Item Env:SENGOO_ROOT -ErrorAction SilentlyContinue
          Remove-Item Env:SENGOO_STDLIB -ErrorAction SilentlyContinue
          Remove-Item Env:SENGOO_RUNTIME -ErrorAction SilentlyContinue
          Write-Host "Installed stdlib smoke work root: $workRoot"
          $smokeSource = Join-Path $workRoot "main.sg"
          @'
          import std::status;

          def main() -> i64 {
              STATUS_OK()
          }
          '@ | Set-Content -LiteralPath $smokeSource -Encoding UTF8
          & $sgc build $smokeSource --emit-llvm --force-rebuild
          if ($LASTEXITCODE -ne 0) {
            throw "installed sgc stdlib smoke failed"
          }
          & $sgc run $smokeSource --force-rebuild
          if ($LASTEXITCODE -ne 0) {
            throw "installed sgc run smoke failed"
          }

      - name: Install package by version (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          work_root="${RUNNER_TEMP}/sengoo-upgrade-smoke-${{ matrix.artifact }}-outside-checkout"
          rm -rf "$work_root"
          mkdir -p "$work_root"
          sh scripts/install.sh --version "$SENGOO_PRIMARY_UPGRADE_VERSION" --base-url "$SENGOO_LOCAL_RELEASE_FEED" --install-dir "$work_root/toolchain"

      - name: Install package by version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $workRoot = Join-Path $env:RUNNER_TEMP "sengoo-upgrade-smoke-${{ matrix.artifact }}-outside-checkout"
          Remove-Item -LiteralPath $workRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $workRoot | Out-Null
          ./scripts/install.ps1 -Version $env:SENGOO_PRIMARY_UPGRADE_VERSION -BaseUrl $env:SENGOO_LOCAL_RELEASE_FEED -InstallDir (Join-Path $workRoot "toolchain")

      - name: Upgrade package by version (POSIX)
        if: runner.os != 'Windows'
        shell: pwsh
        run: |
          function Assert-InstalledToolVersions($Manifest, $BinDir) {
            $expectedSignature = $null
            foreach ($tool in @("sgc", "sgpm", "sgfmt", "sglsp")) {
              $version = & (Join-Path $BinDir $tool) --version
              Write-Host "$tool version: $version"
              $manifestVersion = $Manifest.tool_versions.PSObject.Properties[$tool].Value
              if ($version -ne $manifestVersion) {
                throw "$tool payload does not match manifest: expected $manifestVersion, got $version"
              }
              $signature = $version -replace "^$tool ", ""
              if ($signature -eq $version) {
                throw "unexpected $tool version output: $version"
              }
              if (-not $expectedSignature) {
                $expectedSignature = $signature
              } elseif ($signature -ne $expectedSignature) {
                throw "tool version/hash mismatch: expected $expectedSignature, got $signature from $tool"
              }
            }
          }

          $workRoot = Join-Path $env:RUNNER_TEMP "sengoo-upgrade-smoke-${{ matrix.artifact }}-outside-checkout"
          $installRoot = Join-Path $workRoot "toolchain"
          $bin = Join-Path $installRoot "bin"
          $primaryManifest = Get-Content -LiteralPath (Join-Path $installRoot "manifest.json") -Raw | ConvertFrom-Json
          if ($primaryManifest.version -ne $env:SENGOO_PRIMARY_UPGRADE_VERSION) {
            throw "initial installed manifest version mismatch: expected $env:SENGOO_PRIMARY_UPGRADE_VERSION, got $($primaryManifest.version)"
          }
          Assert-InstalledToolVersions $primaryManifest $bin

          & sh scripts/install.sh --version $env:SENGOO_SECONDARY_UPGRADE_VERSION --base-url $env:SENGOO_LOCAL_RELEASE_FEED --install-dir $installRoot
          if ($LASTEXITCODE -ne 0) {
            throw "POSIX toolchain upgrade failed"
          }
          $upgradedManifest = Get-Content -LiteralPath (Join-Path $installRoot "manifest.json") -Raw | ConvertFrom-Json
          if ($upgradedManifest.version -ne $env:SENGOO_SECONDARY_UPGRADE_VERSION) {
            throw "upgraded manifest version mismatch: expected $env:SENGOO_SECONDARY_UPGRADE_VERSION, got $($upgradedManifest.version)"
          }
          Assert-InstalledToolVersions $upgradedManifest $bin

          Remove-Item Env:SENGOO_ROOT -ErrorAction SilentlyContinue
          Remove-Item Env:SENGOO_STDLIB -ErrorAction SilentlyContinue
          Remove-Item Env:SENGOO_RUNTIME -ErrorAction SilentlyContinue
          $smokeSource = Join-Path $workRoot "outside-checkout-main.sg"
          @'
          import std::status;

          def main() -> i64 {
              STATUS_OK()
          }
          '@ | Set-Content -LiteralPath $smokeSource -Encoding UTF8
          & (Join-Path $bin "sgc") run $smokeSource --force-rebuild
          if ($LASTEXITCODE -ne 0) {
            throw "upgraded sgc outside-checkout smoke failed"
          }

      - name: Upgrade package by version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Assert-InstalledToolVersions($Manifest, $BinDir) {
            $expectedSignature = $null
            foreach ($tool in @("sgc", "sgpm", "sgfmt", "sglsp")) {
              $version = & (Join-Path $BinDir "$tool.exe") --version
              Write-Host "$tool version: $version"
              $manifestVersion = $Manifest.tool_versions.PSObject.Properties[$tool].Value
              if ($version -ne $manifestVersion) {
                throw "$tool payload does not match manifest: expected $manifestVersion, got $version"
              }
              $signature = $version -replace "^$tool ", ""
              if ($signature -eq $version) {
                throw "unexpected $tool version output: $version"
              }
              if (-not $expectedSignature) {
                $expectedSignature = $signature
              } elseif ($signature -ne $expectedSignature) {
                throw "tool version/hash mismatch: expected $expectedSignature, got $signature from $tool"
              }
            }
          }

          $workRoot = Join-Path $env:RUNNER_TEMP "sengoo-upgrade-smoke-${{ matrix.artifact }}-outside-checkout"
          $installRoot = Join-Path $workRoot "toolchain"
          $primaryManifest = Get-Content -LiteralPath (Join-Path $installRoot "manifest.json") -Raw | ConvertFrom-Json
          if ($primaryManifest.version -ne $env:SENGOO_PRIMARY_UPGRADE_VERSION) {
            throw "initial installed manifest version mismatch: expected $env:SENGOO_PRIMARY_UPGRADE_VERSION, got $($primaryManifest.version)"
          }
          Assert-InstalledToolVersions $primaryManifest (Join-Path $installRoot "bin")
          ./scripts/install.ps1 -Version $env:SENGOO_SECONDARY_UPGRADE_VERSION -BaseUrl $env:SENGOO_LOCAL_RELEASE_FEED -InstallDir $installRoot
          $upgradedManifest = Get-Content -LiteralPath (Join-Path $installRoot "manifest.json") -Raw | ConvertFrom-Json
          if ($upgradedManifest.version -ne $env:SENGOO_SECONDARY_UPGRADE_VERSION) {
            throw "upgraded manifest version mismatch: expected $env:SENGOO_SECONDARY_UPGRADE_VERSION, got $($upgradedManifest.version)"
          }
          $bin = Join-Path $installRoot "bin"
          Assert-InstalledToolVersions $upgradedManifest $bin
          Remove-Item Env:SENGOO_ROOT -ErrorAction SilentlyContinue
          Remove-Item Env:SENGOO_STDLIB -ErrorAction SilentlyContinue
          Remove-Item Env:SENGOO_RUNTIME -ErrorAction SilentlyContinue
          $smokeSource = Join-Path $workRoot "outside-checkout-main.sg"
          @'
          import std::status;

          def main() -> i64 {
              STATUS_OK()
          }
          '@ | Set-Content -LiteralPath $smokeSource -Encoding UTF8
          & (Join-Path $bin "sgc.exe") run $smokeSource --force-rebuild
          if ($LASTEXITCODE -ne 0) {
            throw "upgraded sgc outside-checkout smoke failed"
          }

      - name: Upload packaged toolchain
        uses: actions/upload-artifact@v4
        with:
          name: sengoo-toolchain-${{ matrix.artifact }}
          path: |
            target/dist/*.zip
            target/dist/*.tar.gz
            target/dist/*.sha256
            target/dist/*/manifest.json

  publish-release:
    name: publish complete toolchain release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download all smoke-gated archives
        uses: actions/download-artifact@v4
        with:
          pattern: sengoo-toolchain-*
          path: target/dist
          merge-multiple: true

      - name: Attest release archives
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            target/dist/*.zip
            target/dist/*.tar.gz

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/dist/*.zip
            target/dist/*.tar.gz
            target/dist/*.sha256
